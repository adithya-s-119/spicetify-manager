name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./build.ps1

      - name: Check the binaries
        shell: pwsh
        run: |
          foreach ($name in 'SpicetifyGui.exe', 'SpicetifyApply.exe') {
            $item = Get-Item $name
            $bytes = [System.IO.File]::ReadAllBytes($item.FullName)
            if ($bytes.Length -lt 10000) { throw "$name is too small" }
            if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "$name is not a PE file" }
            "{0}: {1} bytes" -f $name, $bytes.Length
          }

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: spicetify-manager
          path: |
            SpicetifyGui.exe
            SpicetifyApply.exe
          if-no-files-found: error
